name: Build Teacher Words Android APK
on:
  pull_request:
    branches: [ main ]
    paths:
      - 'teacher-words-android/**'
      - '.github/workflows/teacher-words-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Ensure Android 35
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Restore and patch ebook asset
        working-directory: teacher-words-android
        run: |
          mkdir -p app/src/main/assets
          cat asset_parts/part_* > ebook.xz.b64
          base64 -d ebook.xz.b64 > ebook.xz
          xz -dc ebook.xz > app/src/main/assets/index.html
          base64 -d patch_v13.py.gz.b64 | gzip -dc > patch_v13.py
          python3 patch_v13.py app/src/main/assets/index.html
          grep -q "ttsSpeak" app/src/main/assets/index.html
          grep -q "電子書載入中" app/src/main/assets/index.html
          echo "ebook bytes: $(wc -c < app/src/main/assets/index.html)"
      - name: Build unsigned release APK
        working-directory: teacher-words-android
        run: gradle --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: teacher-words-v1.3-unsigned
          path: teacher-words-android/app/build/outputs/apk/release/app-release-unsigned.apk
